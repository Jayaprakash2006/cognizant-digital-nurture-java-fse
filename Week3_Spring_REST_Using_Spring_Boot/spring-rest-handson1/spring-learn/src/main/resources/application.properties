# -----------------------------------------------------------------------
# Server configuration
# Change the port here if 8080 is already in use on your machine
# -----------------------------------------------------------------------
server.port=8080

# -----------------------------------------------------------------------
# Hands On 3 – Logging configuration
#
# logging.level.<package> controls the minimum log level for that package:
#   trace < debug < info < warn < error
#
# logging.pattern.console controls the format of console output:
#   %d{pattern}   – timestamp
#   %-20.20thread – thread name, left-aligned, padded to 20 chars
#   %5p           – log level, right-aligned in 5 chars
#   %-25.25logger – logger name, trimmed/padded to 25 chars
#   %25M          – method name, right-padded to 25 chars
#   %m%n          – log message + newline
# -----------------------------------------------------------------------
logging.level.org.springframework=info
logging.level.com.cognizant.springlearn=debug

logging.pattern.console=%d{yyMMdd}|%d{HH:mm:ss.SSS}|%-20.20thread|%5p|%-25.25logger{25}|%25M|%m%n
